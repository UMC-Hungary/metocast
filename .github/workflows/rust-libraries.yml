name: Rust Libraries

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apple/**'
      - 'apple-app/**'
      - 'scripts/build-apple.sh'
      - 'scripts/embed-apple-server.sh'
      - '.github/workflows/rust-libraries.yml'
  push:
    branches:
      - master
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apple/**'
      - 'apple-app/**'
      - 'scripts/build-apple.sh'
      - 'scripts/embed-apple-server.sh'
      - '.github/workflows/rust-libraries.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  apple-libraries:
    name: Apple libraries and Swift package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: apple-libraries

      - name: Check formatting and lints
        run: |
          cargo fmt --all --check
          cargo clippy -p metocast-core -p metocast-client -p metocast-apple --all-targets --all-features -- -D warnings

      - name: Run library tests
        run: cargo test -p metocast-core -p metocast-client -p metocast-apple

      - name: Build and test Swift package
        run: ./scripts/build-apple.sh

      - name: Upload XCFramework
        uses: actions/upload-artifact@v6
        with:
          name: metocast-apple-xcframework
          path: apple/MetocastFFI.xcframework

  apple-app:
    name: Metocast app (iOS and macOS)
    runs-on: macos-latest
    needs: apple-libraries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: apple-libraries

      # The app links the XCFramework and, on macOS, embeds the headless server.
      - name: Build the bridge
        run: ./scripts/build-apple.sh

      - name: Build for iPhone
        run: |
          xcodebuild -project apple-app/Metocast.xcodeproj -scheme Metocast \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath target/apple-app-derived \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build for Mac
        run: |
          xcodebuild -project apple-app/Metocast.xcodeproj -scheme Metocast \
            -destination 'platform=macOS' \
            -derivedDataPath target/apple-app-derived \
            CODE_SIGNING_ALLOWED=NO build
