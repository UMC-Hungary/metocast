name: Rust Libraries

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apple/**'
      - 'apple-app/**'
      - 'scripts/build-apple.sh'
      - 'scripts/embed-apple-server.sh'
      - '.github/workflows/rust-libraries.yml'
  push:
    branches:
      - master
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apple/**'
      - 'apple-app/**'
      - 'scripts/build-apple.sh'
      - 'scripts/embed-apple-server.sh'
      - '.github/workflows/rust-libraries.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  apple-libraries:
    name: Apple libraries and Swift package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: apple-libraries

      - name: Check formatting and lints
        run: |
          cargo fmt --all --check
          cargo clippy -p metocast-core -p metocast-client -p metocast-apple --all-targets --all-features -- -D warnings

      - name: Run library tests
        run: cargo test -p metocast-core -p metocast-client -p metocast-apple

      - name: Build and test Swift package
        run: ./scripts/build-apple.sh

      # Both halves of the bridge: the framework and the Swift it generates. The app job
      # takes these instead of building four Rust targets again.
      - name: Upload the bridge
        uses: actions/upload-artifact@v6
        with:
          name: metocast-apple-xcframework
          path: |
            apple/MetocastFFI.xcframework
            apple/Sources/Metocast/Metocast.swift
          if-no-files-found: error

  apple-app:
    name: Metocast app (iOS and macOS)
    # Pinned, not `macos-latest`: an image roll must not change the SDK this app is built against.
    runs-on: macos-26
    needs: apple-libraries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The Mac app embeds the headless server, which its Xcode build phase compiles.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: apple-libraries

      - name: Download the bridge
        uses: actions/download-artifact@v6
        with:
          name: metocast-apple-xcframework
          path: apple

      - name: Build for iPhone
        run: |
          xcodebuild -project apple-app/Metocast.xcodeproj -scheme Metocast \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath target/apple-app-derived \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build for Mac
        run: |
          xcodebuild -project apple-app/Metocast.xcodeproj -scheme Metocast \
            -destination 'platform=macOS' \
            -derivedDataPath target/apple-app-derived \
            CODE_SIGNING_ALLOWED=NO build

      # Ad-hoc signing seals each bundle so it opens once downloaded, until the signed
      # builds exist. Artifacts drop file modes and symlinks, so ditto zips them first.
      - name: Package the apps
        run: |
          products=target/apple-app-derived/Build/Products
          mkdir -p target/apple-app-dist
          for app in "$products/Debug-iphonesimulator/Metocast.app" "$products/Debug/Metocast.app"; do
            codesign --force --deep --sign - "$app"
          done
          ditto -c -k --keepParent "$products/Debug-iphonesimulator/Metocast.app" \
            target/apple-app-dist/Metocast-iOS-Simulator.zip
          ditto -c -k --keepParent "$products/Debug/Metocast.app" \
            target/apple-app-dist/Metocast-macOS.zip

      - name: Upload the apps
        uses: actions/upload-artifact@v6
        with:
          name: metocast-apple-app
          path: target/apple-app-dist/*.zip
          if-no-files-found: error
