name: Rust Libraries

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apple/**'
      - 'apple-app/**'
      - 'braw-decode/**'
      - 'scripts/build-apple.sh'
      - 'scripts/embed-apple-server.sh'
      - 'scripts/check-screenshots.swift'
      - 'docs/images/**'
      - '.github/workflows/rust-libraries.yml'
  push:
    branches:
      - master
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apple/**'
      - 'apple-app/**'
      - 'braw-decode/**'
      - 'scripts/build-apple.sh'
      - 'scripts/embed-apple-server.sh'
      - 'scripts/check-screenshots.swift'
      - 'docs/images/**'
      - '.github/workflows/rust-libraries.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Vision's text recognition only exists on macOS. A runner is not the operator's Mac, so this
  # checks the generic patterns (LAN addresses, tokens, other users' home folders); the machine
  # name check happens where the screenshot is taken.
  screenshots:
    name: Documentation screenshots
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check screenshots show nothing that identifies a machine
        run: swift scripts/check-screenshots.swift docs/images

  apple-libraries:
    name: Apple libraries and Swift package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: apple-libraries

      - name: Check formatting and lints
        run: |
          cargo fmt --all --check
          cargo clippy -p metocast-core -p metocast-client -p metocast-apple -p metocast-mcp-bridge --all-targets --all-features -- -D warnings

      - name: Run library tests
        run: cargo test -p metocast-core -p metocast-client -p metocast-apple -p metocast-mcp-bridge

      - name: Build and test Swift package
        run: ./scripts/build-apple.sh

      # Both halves of the bridge: the framework and the Swift it generates. The app job
      # takes these instead of building four Rust targets again.
      - name: Upload the bridge
        uses: actions/upload-artifact@v6
        with:
          name: metocast-apple-xcframework
          path: |
            apple/MetocastFFI.xcframework
            apple/Sources/Metocast/Metocast.swift
          if-no-files-found: error

  apple-app:
    name: Metocast app (iOS and macOS)
    # Pinned, not `macos-latest`: an image roll must not change the SDK this app is built against.
    runs-on: macos-26
    needs: apple-libraries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The Mac app embeds the headless server, which its Xcode build phase compiles.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: apple-libraries

      - name: Download the bridge
        uses: actions/download-artifact@v7
        with:
          name: metocast-apple-xcframework
          path: apple

      - name: Build for iPhone
        run: |
          xcodebuild -project apple-app/Metocast.xcodeproj -scheme Metocast \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath target/apple-app-derived \
            CODE_SIGNING_ALLOWED=NO build

      # braw-decode is compiled against the Blackmagic RAW SDK, which Blackmagic's licence keeps
      # out of this repository and whose download sits behind a registration form, so no runner
      # can have it. The app's build phase uses braw-decode/prebuilt instead, which only a Mac
      # with the SDK can refresh — so fail here when its sources moved and it did not.
      - name: Check the prebuilt braw-decode is current
        run: |
          want=$(cat braw-decode/src/braw_decode.mm braw-decode/build.sh | shasum -a 256 | awk '{print $1}')
          have=$(cat braw-decode/prebuilt/sources.sha256)
          if [ "$want" != "$have" ]; then
            echo "::error::braw-decode sources changed but braw-decode/prebuilt did not; rebuild it on a Mac with the Blackmagic RAW SDK (braw-decode/README.md)"
            exit 1
          fi

      # Release, not Debug: a Debug build ships Metocast.debug.dylib and __preview.dylib and
      # skips optimisation. Every run builds what people install, so CI checks the real thing.
      - name: Build for Mac
        run: |
          xcodebuild -project apple-app/Metocast.xcodeproj -scheme Metocast \
            -destination 'platform=macOS' -configuration Release \
            -derivedDataPath target/apple-app-derived \
            CODE_SIGNING_ALLOWED=NO build

      # The build phase leaves braw-decode out when it cannot find the SDK, which is how builds
      # here shipped a Mac app with no Blackmagic RAW support at all. The helper has to be in the
      # app, and it has to link nothing but system libraries: it loads Blackmagic's framework at
      # run time from the Mac it runs on, so a link to the SDK would break every other Mac.
      - name: Check the Mac app ships braw-decode
        run: |
          helper=target/apple-app-derived/Build/Products/Release/Metocast.app/Contents/MacOS/braw-decode
          if [ ! -x "$helper" ]; then
            echo "::error::the Mac app has no braw-decode; the build did not find the Blackmagic RAW SDK"
            exit 1
          fi
          outside=$(otool -L "$helper" | awk 'NR > 1 && $1 !~ /^\/(usr\/lib|System\/Library)\// { print $1 }')
          if [ -n "$outside" ]; then
            echo "::error::braw-decode links outside the system: $outside"
            exit 1
          fi

      # The bridge for Claude Desktop is a subcommand of the helper the app ships. A person with
      # only Metocast and an AI app has no Python, Node or Homebrew, so it must start with
      # nothing, link only system libraries, and say plainly why it cannot reach Metocast.
      - name: Check the MCP stdio bridge needs no developer tools
        run: |
          helper=target/apple-app-derived/Build/Products/Release/Metocast.app/Contents/MacOS/metocast-server
          outside=$(otool -L "$helper" | awk 'NR > 1 && $1 !~ /^\/(usr\/lib|System\/Library)\// { print $1 }')
          if [ -n "$outside" ]; then
            echo "::error::metocast-server links outside the system: $outside"
            exit 1
          fi
          code=0
          message=$(env -i PATH= "$helper" mcp-stdio --check --url http://127.0.0.1:9/mcp 2>&1) || code=$?
          echo "$message"
          [ "$code" = 1 ] && echo "$message" | grep -q "not running"

      # Ad-hoc signing seals each bundle so it opens once downloaded, until the signed
      # builds exist. Artifacts drop file modes and symlinks, so ditto zips them first.
      - name: Package the apps
        run: |
          products=target/apple-app-derived/Build/Products
          mkdir -p target/apple-app-dist
          for app in "$products/Debug-iphonesimulator/Metocast.app" "$products/Release/Metocast.app"; do
            codesign --force --deep --sign - "$app"
          done
          ditto -c -k --keepParent "$products/Debug-iphonesimulator/Metocast.app" \
            target/apple-app-dist/Metocast-iOS-Simulator.zip
          ditto -c -k --keepParent "$products/Release/Metocast.app" \
            target/apple-app-dist/Metocast-macOS.zip

      # `archive: false` uploads each zip as-is, so a download is the app's own zip
      # rather than a zip wrapped around it; the file name becomes the artifact name.
      - name: Upload the Mac app
        id: mac-app
        uses: actions/upload-artifact@v7
        with:
          path: target/apple-app-dist/Metocast-macOS.zip
          archive: false
          if-no-files-found: error

      - name: Upload the iOS Simulator app
        id: ios-app
        uses: actions/upload-artifact@v7
        with:
          path: target/apple-app-dist/Metocast-iOS-Simulator.zip
          archive: false
          if-no-files-found: error

      # The run page lists artifacts, but the pull request's Checks view doesn't.
      - name: Link the downloads
        env:
          MAC_URL: ${{ steps.mac-app.outputs.artifact-url }}
          IOS_URL: ${{ steps.ios-app.outputs.artifact-url }}
        run: |
          {
            echo "### Downloads"
            echo "- [Metocast-macOS.zip]($MAC_URL): unzip and open; allow the first launch under System Settings → Privacy & Security."
            echo "- [Metocast-iOS-Simulator.zip]($IOS_URL): unzip, then \`xcrun simctl install booted Metocast.app\`."
          } >> "$GITHUB_STEP_SUMMARY"
