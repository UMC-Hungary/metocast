name: Presenter Receiver Release

on:
  push:
    tags:
      - 'presenter-receiver-v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            artifact: presenter-receiver-macos-arm64

          - runner: ubuntu-22.04
            artifact: presenter-receiver-linux-x86_64

          - runner: ubuntu-24.04-arm
            artifact: presenter-receiver-linux-arm64

          # 32-bit Raspberry Pi OS (armhf). Cross-compiled in a Debian bullseye
          # container so the binary only needs glibc 2.31 and links the armhf
          # Cairo/Pango that Raspberry Pi OS 11+ ships.
          - runner: ubuntu-24.04
            artifact: presenter-receiver-linux-armv7
            target: armv7-unknown-linux-gnueabihf
            container: debian:bullseye

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    name: Build (${{ matrix.artifact }})

    steps:
      - name: Prepare Debian container
        if: matrix.container
        run: |
          # Bullseye is end-of-life: its packages (security updates included)
          # are only kept complete on archive.debian.org.
          cat > /etc/apt/sources.list <<'EOF'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian bullseye-updates main
          deb http://archive.debian.org/debian-security bullseye-security main
          EOF
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install macOS dependencies (Cairo + Pango via Homebrew)
        if: runner.os == 'macOS'
        run: |
          for pkg in cairo pango harfbuzz pkg-config; do
            brew list --versions "$pkg" || brew install "$pkg"
          done

      - name: Install Linux dependencies (Cairo + Pango via apt)
        if: runner.os == 'Linux' && !matrix.target
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config

      - name: Install armhf cross toolchain and Cairo + Pango
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            libcairo2-dev:armhf libpango1.0-dev:armhf
          {
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc"
            echo "CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Get Homebrew library versions for cache key
        if: runner.os == 'macOS'
        id: brew-versions
        run: echo "ver=$(brew list --versions harfbuzz cairo pango glib | tr ' \n' '_')" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ${{ matrix.artifact }}-${{ steps.brew-versions.outputs.ver || 'linux' }}

      - name: Build release binary
        working-directory: presenter-receiver
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix cairo)/lib/pkgconfig:$(brew --prefix pango)/lib/pkgconfig"
          fi
          if [ -n "$TARGET" ]; then
            cargo build --release --target "$TARGET"
          else
            cargo build --release
          fi
        env:
          TARGET: ${{ matrix.target }}

      - name: Rename binary with platform suffix
        shell: bash
        run: cp target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/presenter-receiver ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: false
          body: |
            Standalone terminal binary that connects to the Metocast WebSocket
            and renders the active presentation slide on-screen.

            - **macOS**: opens a native window (Helvetica Neue, Cairo-rendered)
            - **Linux / Raspberry Pi**: writes directly to the framebuffer (`/dev/fb0`) — no desktop needed

            | Platform | Binary |
            |---|---|
            | Raspberry Pi OS 64-bit / Linux arm64 | `presenter-receiver-linux-arm64` |
            | Raspberry Pi OS 32-bit / Linux armhf (armv7) | `presenter-receiver-linux-armv7` |
            | Linux x86_64 | `presenter-receiver-linux-x86_64` |
            | macOS Apple Silicon | `presenter-receiver-macos-arm64` |

            ### One-line install (auto-detects platform)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/UMC-Hungary/metocast/master/presenter-receiver/install.sh | bash -s -- ws://YOUR_SERVER_IP:3737/ws
            ```

            To install without running immediately:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/UMC-Hungary/metocast/master/presenter-receiver/install.sh | bash
            ```
          files: |
            artifacts/presenter-receiver-macos-arm64/presenter-receiver-macos-arm64
            artifacts/presenter-receiver-linux-x86_64/presenter-receiver-linux-x86_64
            artifacts/presenter-receiver-linux-arm64/presenter-receiver-linux-arm64
            artifacts/presenter-receiver-linux-armv7/presenter-receiver-linux-armv7
