[package]
name = "metocast-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Tauri-free server host boundary and lifecycle types for Metocast"

[dependencies]
aes = "0.8"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
blackmagic-camera = { path = "../../blackmagic-camera" }
chrono.workspace = true
cipher = "0.4"
cpal = "0.18.2"
flac-bound = { version = "0.5.0", default-features = false, features = ["libflac-noogg"] }
futures-util.workspace = true
hex = "0.4"
if-addrs = "0.13"
liblzma = { version = "0.4.6", features = ["static"] }
local-ip-address = "0.6"
mdns-sd = "0.11"
metocast-core = { path = "../metocast-core" }
obws = { version = "0.14.0", features = ["events"] }
postgresql_embedded = { version = "0.20", default-features = false, features = ["tokio", "rustls", "zonky"] }
quick-xml = "0.39.2"
regex = "1.12.3"
reqwest = { workspace = true, features = ["form", "stream", "multipart"] }
rodecaster = { path = "../../rodecaster" }
semver = "1.0.27"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror.workspace = true
tokio.workspace = true
tokio-cron-scheduler = "0.15.1"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1.3"
usvg = "0.47"
uuid.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
