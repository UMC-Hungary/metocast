[package]
name = "metocast"
version = "2.1.0"
description = "Metocast — livestream control desktop application"
authors = ["you"]
edition.workspace = true
rust-version.workspace = true
default-run = "metocast"

[lib]
name = "metocast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-store = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-liquid-glass = "0.1.6"
tauri-plugin-deep-link = "2"
tauri-plugin-native-nav = { path = "plugins/native-nav" }

# Desktop-only dependencies (server + database — not available on iOS/Android)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
metocast-server = { path = "../crates/metocast-server" }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-updater = "2.10.0"

[lints]
workspace = true
