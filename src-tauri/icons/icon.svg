<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="-216.5 -211.5 1690 1690" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Metocast Retro TV App Icon</title>
  <desc>A cropped app icon version of the retro television logo with color bars, control dials, and speaker lines.</desc>

  <!-- Rounded app icon field -->
  <rect x="-51.5" y="-46.5" width="1360" height="1360" rx="306" fill="#070817"/>

