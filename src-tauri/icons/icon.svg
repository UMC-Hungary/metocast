  <!-- Inner screen cavity -->
  <rect x="223" y="340" width="639" height="558" rx="72" fill="#050616"/>

  <!-- Color screen clipped shape -->
  <defs>
    <clipPath id="screenClip">
      <path d="M281 405C281 386 288 375 306 371C363 358 738 359 783 372C805 379 816 397 816 426V729C816 753 803 767 779 771C706 784 369 783 306 771C287 767 281 754 281 731V405Z"/>
