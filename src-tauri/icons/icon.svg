  <path d="M306 371C363 358 738 359 783 372C805 379 816 397 816 426V446C805 417 792 405 765 400C687 386 390 386 321 399C294 404 284 417 281 446V405C281 386 288 375 306 371Z" fill="white" opacity="0.12"/>
